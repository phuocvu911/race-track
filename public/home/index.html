<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beachside Racetrack Home</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/home/style.css" />
  </head>

  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">B</span>
          <span>BEACHSIDE RACETRACK</span>
        </a>
      </header>
      <main class="page">
        <div class="page-heading">
          <div>
            <h1>Choose your <span class="accent">screen</span></h1>
          </div>
        </div>
        <section class="home-section">
          <div class="panel-heading">
            <div>
              <h2>Public Display</h2>
            </div>
          </div>
          <div class="home-link-grid">
            <a class="home-link-card" href="/leader-board">
              <span class="home-link-index">01</span>
              <span><strong>Leader Board</strong></span>
              <span class="home-link-arrow">↗</span>
            </a>
            <a class="home-link-card" href="/next-race">
              <span class="home-link-index">02</span>
              <span><strong>Next Race</strong></span>
              <span class="home-link-arrow">↗</span>
            </a>
            <a class="home-link-card" href="/race-countdown">
              <span class="home-link-index">03</span>
              <span><strong>Race Countdown</strong></span>
              <span class="home-link-arrow">↗</span>
            </a>
            <a class="home-link-card" href="/race-flags">
              <span class="home-link-index">04</span>
              <span><strong>Race Flags</strong></span>
              <span class="home-link-arrow">↗</span>
            </a>
          </div>
        </section>
        <section class="home-section">
          <div class="panel-heading">
            <div>
              <h2>Staff Screen</h2>
            </div>
          </div>
          <div class="home-link-grid">
            <a class="home-link-card staff-link" href="/front-desk">
              <span class="home-link-index">05</span>
              <span><strong>Front Desk</strong></span>
              <span class="home-link-arrow">→</span>
            </a>
            <a class="home-link-card staff-link" href="/race-control">
              <span class="home-link-index">06</span>
              <span><strong>Race Control</strong></span>
              <span class="home-link-arrow">→</span>
            </a>
            <a class="home-link-card staff-link" href="/lap-line-tracker">
              <span class="home-link-index">07</span>
              <span><strong>Lap-line Tracker</strong></span>
              <span class="home-link-arrow">→</span>
            </a>
          </div>
          <p class="footer-note">
            Staff screen require role-specific access key.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
