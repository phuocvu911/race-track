<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Race countdown</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/race-countdown/style.css" />
  </head>
  <body data-screen="race-countdown">
    <div id="app">
        <div class="page-heading">
            <div>
                <h1>Race <span class="accent">countdown</span></h1>
            </div>
        </div>  
        <section class="big-countdown">
            <div class="timer" data-countdown></div>
        </section>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/race-countdown/script.js"></script>
  </body>
</html>
